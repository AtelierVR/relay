[package]
name    = "noxrelay"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "noxrelay"
path = "src/main.rs"

[dependencies]
# -- Async runtime -------------------------------------------------------
tokio = { version = "1", features = ["full"] }

# -- QUIC transport ------------------------------------------------------
quinn   = "0.11"
rustls  = { version = "0.23", default-features = false, features = ["ring"] }
rcgen   = "0.13"

# -- WebSocket to MasterServer -------------------------------------------
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util       = "0.3"

# -- Binary serialization ------------------------------------------------
bytes     = "1"
byteorder = "1"

# -- Cryptography --------------------------------------------------------
ring   = "0.17"
argon2 = "0.5"
rsa    = { version = "0.9", features = ["sha2"] }
sha2   = "0.10"
hex    = "0.4"

# -- JSON / config -------------------------------------------------------
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
figment    = { version = "0.10", features = ["json", "env"] }

# -- System monitoring ---------------------------------------------------
sysinfo = "0.32"

# -- Structured logging --------------------------------------------------
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# -- Concurrent state ----------------------------------------------------
dashmap = "6"

# -- Math / geometry -----------------------------------------------------
glam = "0.28"

# -- Utilities -----------------------------------------------------------
bitflags    = "2"
thiserror   = "2"
anyhow      = "1"
uuid        = { version = "1", features = ["v4"] }
parking_lot = "0.12"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = "symbols"
